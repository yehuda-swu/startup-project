<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0073ab">
  <meta name="description" content="StandWithUs UK StartUp Project Portal">
  <title>StartUp | Project Portal</title>
  <link rel="icon" href="favicon.png?v=3" type="image/png">
  <link rel="stylesheet" href="styles.css?v=8">
  <style>
    /* Essential fallback styles if a previous stylesheet is cached */
    .brandlogo{width:64px!important;height:64px!important;max-width:64px!important;max-height:64px!important;object-fit:contain!important;flex-shrink:0!important}
    .authaside .brandlogo{width:76px!important;height:76px!important;max-width:76px!important;max-height:76px!important}
    @media(max-width:650px){.brandlogo,.authaside .brandlogo{width:56px!important;height:56px!important;max-width:56px!important;max-height:56px!important}}
  </style>
</head>
<body>
  <div id="app"><div class="loading"><span class="spinner"></span><p>Opening your StartUp Portal…</p></div></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
   (function () {
     const root=document.getElementById('app');
     const logo='<img src="logo.png?v=6" width="76" height="76" class="brandlogo" style="width:76px;height:76px;max-width:76px;max-height:76px;object-fit:contain" alt="StartUp logo">';
     function escapeHTML(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
     window.StartUpShowError=function(heading,message,error){
       if(!root.querySelector('.loading') && !root.querySelector('[data-portal-error]'))return;
       if(error)console.error('StartUp Portal:',error);
       const detail=error?.message||'';
       root.innerHTML=`<main class="authwrap" data-portal-error>
          <section class="authaside">
            <div class="brand">${logo}<span>StartUp<small>StandWithUs UK · Project Portal</small></span></div>
            <div><div class="eyebrow" style="color:#e6f8ff">STARTUP 2026/27</div>
               <h1>Research. Create.<br>Make an impact.</h1>
               <p>Our shared space for team research, creative ideas and supervisor feedback.</p></div>
            <div style="font-size:12px;opacity:.85">StandWithUs UK · Explore Programme</div>
          </section>
          <section class="authmain"><div class="authbox">
            <div class="eyebrow">Connection help</div>
            <h2>${escapeHTML(heading)}</h2>
            <p>${escapeHTML(message)}</p>
            ${detail?`<div class="alert warning" style="overflow-wrap:anywhere">Technical detail: ${escapeHTML(detail).slice(0,350)}</div>`:''}
            <div class="stack" style="margin-top:20px">
              <button type="button" class="btn primary" onclick="location.reload()">Try again</button>
              <a class="btn outline" href="preview.html?v=3">View an example workspace</a>
            </div>
            <p class="hint">If the error continues, check that GitHub contains <strong>app.js</strong>, <strong>styles.css</strong>, and <strong>firebaseConfig.js</strong> beside <strong>index.html</strong>. We can also check the browser console using F12.</p>
          </div></section>
        </main>`;
     };
     if(location.protocol==='file:'){
       window.StartUpShowError('Open the example workspace','The downloaded files cannot connect to Firebase when opened directly from your computer. Publish them through GitHub Pages, or view the example workspace.');
       return;
     }
     window.setTimeout(()=>{
       if(root.querySelector('.loading')) window.StartUpShowError('Sign in did not finish loading','The Firebase sign in service is not responding. Check your internet connection and Firebase settings.');
     },15000);
   })();
  </script>
  <script type="module">
    if(location.protocol!=='file:'){
      try{ await import('./app.js?v=10'); }
      catch(error){
        console.error('Failed to load StartUp application:',error);
        const m=String(error?.message||'');
        let description='A required application script failed to load. Make sure all files were uploaded together to the GitHub repository.';
        if(/firebaseConfig|export|SyntaxError|does not provide an export|Unexpected token/i.test(m))description='A JavaScript file could not be loaded correctly. Verify that firebaseConfig.js contains export const firebaseConfig and that all files are the latest version.';
        else if(/fetch|network|Failed to load/i.test(m))description='The browser could not load one or more JavaScript modules. Check that the GitHub files are present and that access to Google Firebase libraries is not blocked.';
        window.StartUpShowError('The portal could not start',description,error);
      }
    }
  </script>
</body>
</html>
